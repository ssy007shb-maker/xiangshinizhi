<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闻香识你 · 香调人格测试</title>
<meta name="description" content="十道题，测出你的香调人格，并推荐三支真正适合你的香水。">
<meta property="og:title" content="闻香识你 · 香调人格测试">
<meta property="og:description" content="十道题，找到与你最像的那一类香气，以及三支适合你的香水。">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#f5f1ea; --ink:#26221e; --muted:#847a6e;
    --line:#e4dcd1; --accent:#8a6a4b; --card:#fffdf9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(130% 55% at 50% 0%, var(--tint, #efe7dd) 0%, var(--page-bg, #f5f1ea) 62%)
      fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.7;
    transition:background .6s ease;
  }
  .wrap{max-width:520px; margin:0 auto; padding:22px 22px 56px; min-height:100vh; display:flex; flex-direction:column;}
  .brand{
    font-size:12px; letter-spacing:.34em; color:var(--muted);
    text-align:center; padding:6px 0 10px; flex:0 0 auto;
  }
  main{flex:1 1 auto;}

  /* ---------- 封面 ---------- */
  .cover{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:6vh;}
  .hero{position:relative; width:100%; display:flex; justify-content:center; margin-bottom:18px;}
  .hero .glow{
    position:absolute; top:14%; width:230px; height:230px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(206,166,120,.42), rgba(206,166,120,0) 68%);
  }
  .hero svg{position:relative; z-index:1;}

  .cover .eyebrow{font-size:11px; letter-spacing:.4em; color:var(--muted); margin-bottom:12px;}
  .cover h1{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:42px; font-weight:600; letter-spacing:.18em; margin:0 0 6px; text-indent:.18em;
  }
  .cover .en{
    font-size:11px; letter-spacing:.5em; color:var(--muted);
    text-transform:uppercase; margin-bottom:20px; text-indent:.5em;
  }
  .cover p{color:var(--muted); font-size:15px; margin:0; max-width:290px; line-height:1.9;}
  .cover .meta{margin-top:16px; font-size:12px; color:var(--muted); letter-spacing:.06em;}
  .cover .btn{margin-top:30px;}

  .btn{
    display:block; width:100%; padding:16px 20px; cursor:pointer;
    background:var(--ink); color:#fff; border:none; border-radius:999px;
    font-size:16px; letter-spacing:.1em; font-family:inherit;
  }
  .btn:active{opacity:.85;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.wide{max-width:300px;}

  /* ---------- 答题 ---------- */
  .progress{height:2px; background:var(--line); border-radius:2px; overflow:hidden;}
  .progress i{display:block; height:100%; width:0; background:var(--accent); transition:width .45s ease;}
  .q-head{display:flex; justify-content:space-between; align-items:baseline; margin:20px 0 4px; gap:12px;}
  .q-index{font-size:11px; letter-spacing:.3em; color:var(--muted); flex:0 0 auto;}
  .q-hint{
    font-size:12px; color:var(--muted); text-align:right;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    letter-spacing:.04em; opacity:.85;
  }
  .q-title{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:22px; font-weight:600; margin:12px 0 4px; line-height:1.6;
    letter-spacing:.01em;
  }
  .q-sub{color:var(--muted); font-size:13px; margin:0 0 24px;}
  .back{
    display:inline-block; margin-top:6px; padding:8px 2px; cursor:pointer;
    background:none; border:none; font-family:inherit; color:var(--muted);
    font-size:13px; letter-spacing:.06em;
  }
  .back:active{opacity:.6;}
  .opt{
    display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left; cursor:pointer;
    padding:15px 16px; margin-bottom:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    font-family:inherit; color:inherit;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .opt:hover{border-color:#cbb79f; box-shadow:0 4px 14px rgba(120,96,70,.06);}
  .opt:active{transform:scale(.99);}
  .opt.picked{
    border-color:var(--c,#8a6a4b);
    background:var(--tint,#f3ede4);
    box-shadow:0 0 0 2px rgba(138,106,75,.12);
  }
  .opt.picked .dot{opacity:.9;}
  .dot{
    flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:8px;
    background:var(--c,#c9b79f); opacity:.42;
  }
  .opt b{display:block; font-size:16px; font-weight:600;}
  .opt small{display:block; color:var(--muted); font-size:13px; margin-top:3px;}

  /* ---------- 结果 ---------- */
  .result{animation:fade .5s ease;}
  .hero-card{
    margin:0 -22px 0; padding:26px 22px 20px; text-align:center; position:relative;
    background:linear-gradient(180deg, var(--tint,#efe7dd) 0%, rgba(245,241,234,0) 100%);
  }
  .hero-card::after{
    content:""; display:block; height:1.5px; margin:20px auto 0; max-width:220px;
    background:linear-gradient(90deg, transparent, var(--c,#8a6a4b), transparent);
    opacity:.45;
  }
  .hero-card .kicker{font-size:11px; letter-spacing:.34em; color:var(--muted);}
  .hero-card .name{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:36px; font-weight:600; letter-spacing:var(--ls,.1em);
    margin:8px 0 2px;
  }
  .hero-card .tag{color:var(--c,#8a6a4b); font-size:13px; letter-spacing:.16em;}

  /* 一句话：固定两行，避免第二行只有一个字 */
  .line{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:19px; margin:20px auto 0; max-width:340px; line-height:1.85;
    color:var(--ink2, #3d3730); letter-spacing:.02em;
  }
  .line span{display:block; white-space:nowrap;}

  .words{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .words span{
    font-size:12px; padding:3px 12px; border-radius:99px;
    background:var(--tint,#efe7dd); color:var(--c,#8a6a4b);
    letter-spacing:.08em;
  }

  .art{margin:14px 0 0; display:flex; justify-content:center;}
  .art svg{width:128px; height:128px;}

  .block{margin-top:26px;}
  .block h3{
    font-size:11px; letter-spacing:.3em; color:var(--c,#8a6a4b);
    opacity:.85; font-weight:600; margin:0 0 14px;
    display:flex; align-items:center; gap:9px;
  }
  .block h3::before{
    content:""; flex:0 0 auto; width:6px; height:6px; border-radius:50%;
    background:var(--c,#8a6a4b); opacity:.7;
  }
  .block h3::after{content:""; flex:1; height:1px; background:var(--c,#e4dcd1); opacity:.2;}
  .block p{margin:0; font-size:15px; line-height:1.9; color:var(--ink2,#3d3730);}
  .block p + p{margin-top:10px;}
  .block p.basis{
    font-size:12.5px; color:var(--muted); line-height:1.95;
    padding-left:12px; border-left:2px solid var(--c,#e4dcd1);
    opacity:.95; letter-spacing:.01em;
  }

  .bars{display:flex; flex-direction:column; gap:12px;}
  .bar-row{display:flex; align-items:center; gap:12px;}
  .bar-row em{
    font-style:normal; font-size:11px; color:var(--muted); letter-spacing:.14em;
    flex:0 0 34px;
  }
  .bar-track{flex:1; height:8px; background:#ece5db; border-radius:99px; overflow:hidden;}
  .bar-track i{
    display:block; height:100%; border-radius:99px; width:0;
    transition:width .85s cubic-bezier(.22,.8,.3,1);
  }
  .bar-desc{font-size:13px; color:var(--muted); margin:4px 0 0 46px;}

  .comp .bar-row em{flex:0 0 52px; font-size:12px; letter-spacing:.06em;}
  .comp .bar-track{height:7px;}

  .duo{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mini{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r,14px);
    padding:14px 14px; font-size:13px; line-height:1.75;
    color:var(--ink2,#3d3730);
  }
  .mini b{display:block; font-size:11px; letter-spacing:.2em; color:var(--c,#8a6a4b); opacity:.85; margin-bottom:6px; font-weight:600;}
  .duo .mini:nth-child(1){background:var(--tint,#efe7dd); border-color:transparent;}
  /* 「建议避开」用虚线框区分，避免和下方推荐卡撞脸 */
  .duo .mini:nth-child(2){
    background:transparent;
    border:1px dashed #d3c3ad;
    color:var(--muted);
  }
  .duo .mini:nth-child(2) b{color:var(--muted); opacity:.8;}

  .picks{display:flex; flex-direction:column; gap:9px;}
  .pick{
    position:relative; display:flex; align-items:flex-start; gap:13px;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--r,14px);
    padding:13px 15px 13px 18px; overflow:hidden;
  }
  .pick::before{
    content:""; position:absolute; left:0; top:13px; bottom:13px; width:4px;
    border-radius:0 4px 4px 0; background:var(--c,#8a6a4b); opacity:.55;
  }
  .pick .no{
    flex:0 0 26px; height:26px; border-radius:50%; margin-top:2px;
    background:var(--tint,#efe7dd); color:var(--c,#8a6a4b);
    font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .pick-body{flex:1; min-width:0;}
  .pick b{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:15.5px; font-weight:600;
  }
  .tier{
    font-size:10px; font-weight:500; letter-spacing:.08em;
    padding:1px 8px; border-radius:99px;
    background:var(--tint,#efe7dd); color:var(--c,#8a6a4b);
  }
  .pick small{
    display:block; color:var(--muted); font-size:11.5px; margin-top:3px;
    letter-spacing:.02em;
  }
  .pick em{
    display:block; font-style:normal; font-size:12.5px;
    color:var(--ink2,#5f574d); opacity:.9; margin-top:8px; line-height:1.7;
  }

  .share-tip{
    margin-top:26px; padding:15px 18px;
    background:var(--tint,#efe7dd);
    border:1px dashed #d6c4ad; border-radius:var(--r,14px);
    color:#6b6156; font-size:12.5px; line-height:1.8; text-align:center;
  }
  .source-note{
    margin-top:12px; text-align:center;
    font-size:11.5px; color:var(--muted); letter-spacing:.04em;
  }
  .foot{
    margin-top:30px; text-align:center; font-size:11px;
    color:var(--muted); letter-spacing:.08em; flex:0 0 auto;
  }

  /* ---------- 分享图弹层 ---------- */
  .share-overlay{
    position:fixed; inset:0; z-index:99;
    background:rgba(22,19,16,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:22px;
    animation:fade .25s ease;
  }
  .share-overlay img{
    max-width:92vw; max-height:74vh; border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  .share-overlay p{
    color:#e6ded2; font-size:13px; letter-spacing:.12em; margin:0;
  }
  .share-overlay .close{
    margin-top:4px; padding:10px 26px; border-radius:99px; cursor:pointer;
    background:transparent; color:#cfc6b8; border:1px solid rgba(255,255,255,.22);
    font-size:13px; font-family:inherit;
  }
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- 音乐开关 ---------- */
  .music-toggle{position:fixed;top:14px;right:14px;z-index:40;border:1px solid var(--c,#8a6a4b);
    background:rgba(255,255,255,.82);color:var(--c,#8a6a4b);font-size:12px;padding:6px 13px;
    border-radius:999px;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);
    transition:opacity .2s,color .2s,border-color .2s}
  .music-toggle.off{opacity:.55;color:#8a8075;border-color:#cfc6ba}
  .music-credit{font-size:11px;color:#a99f92;margin-top:18px;letter-spacing:.04em;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">闻 香 识 你</div>
  <main id="screen"></main>
  <div class="foot">香调数据来源 · Scento Perfume Database</div>
</div>

<script>
/* =========================================================
   题库：32 题，每次抽 10 道（分布均衡），选项顺序打乱
   ========================================================= */
const QUESTIONS = [
  /* ---------- 轮 1 · 日常 ---------- */
  { q:"早上闹钟响了，你通常会：", sub:"选最接近你真实反应的那个", options:[
    { t:"立刻起来，今天有要做的事", d:"躺着反而更累", k:"citrus" },
    { t:"再躺五分钟，顺序不能乱", d:"刷牙、喝水、出门，一步不能少", k:"musk" },
    { t:"关掉再睡，睡饱最重要", d:"醒了才算真的开始", k:"sweet" },
    { t:"先看看窗外天气怎么样", d:"决定今天怎么过", k:"green" } ]},

  { q:"周末睡到自然醒，你第一件事：", sub:"没有安排的那种周末", options:[
    { t:"翻手机，看看有没有人约", d:"有人一起更好玩", k:"fruity" },
    { t:"拉开窗帘，让光进来", d:"房间亮了人就醒了", k:"green" },
    { t:"想想今天吃什么", d:"胃先醒", k:"sweet" },
    { t:"什么都不做，先发会儿呆", d:"让脑子慢慢开机", k:"mystery" } ]},

  { q:"你更喜欢哪种早晨？", sub:"凭画面感选", options:[
    { t:"阳光很足，适合出门", d:"一天有很多可能", k:"citrus" },
    { t:"有雾，安静，人很少", d:"世界还没开始吵", k:"woody" },
    { t:"刚下过雨，空气很新", d:"像被洗过一遍", k:"green" },
    { t:"厨房有热的东西在煮", d:"有人在就是安心", k:"sweet" } ]},

  { q:"早餐你更想吃：", sub:"不用考虑热量", options:[
    { t:"一杯热牛奶配面包", d:"简单、稳、不折腾", k:"musk" },
    { t:"水果酸奶加坚果", d:"清爽，吃完不困", k:"fruity" },
    { t:"豆浆油条，热的", d:"从小吃到大", k:"floral" },
    { t:"随便，看当时心情", d:"没想好就出门了", k:"mystery" } ]},

  { q:"出门前照镜子，你主要在确认：", sub:"诚实一点", options:[
    { t:"精神不精神", d:"气色好不好", k:"citrus" },
    { t:"衣服搭不搭", d:"出门要有样子", k:"fruity" },
    { t:"有没有哪里不对", d:"细节不能出错", k:"woody" },
    { t:"身上味道淡不淡", d:"干净最重要", k:"musk" } ]},

  { q:"包里一定会带的一样东西：", sub:"只能选一样", options:[
    { t:"纸巾", d:"总有用上的时候", k:"floral" },
    { t:"水杯", d:"不喝水会难受", k:"green" },
    { t:"耳机", d:"没有它路上很难熬", k:"mystery" },
    { t:"钥匙", d:"少了回不了家", k:"musk" } ]},

  { q:"路上遇到不太熟的同学，你会：", sub:"第一反应", options:[
    { t:"主动打招呼，聊两句", d:"不打招呼反而尴尬", k:"citrus" },
    { t:"点个头就过去", d:"礼貌但不勉强", k:"musk" },
    { t:"看对方有没有先看到我", d:"有点犹豫", k:"mystery" },
    { t:"笑着挥挥手，声音大一点", d:"热闹一点没关系", k:"fruity" } ]},

  { q:"到教室发现来早了十分钟：", sub:"一个人，没人找你", options:[
    { t:"找个靠窗的位置坐下", d:"正好晒会儿太阳", k:"floral" },
    { t:"戴上耳机听点东西", d:"十分钟刚好", k:"woody" },
    { t:"把昨天的笔记翻一翻", d:"心里踏实", k:"green" },
    { t:"趴一会儿，补个觉", d:"能睡就睡", k:"sweet" } ]},

  /* ---------- 轮 2 · 关系 ---------- */
  { q:"朋友心情不好，你第一反应：", sub:"不用想标准答案", options:[
    { t:"先问清楚发生了什么", d:"把事弄明白才好帮", k:"citrus" },
    { t:"先陪着，不急着说话", d:"在旁边就够了", k:"floral" },
    { t:"带他出去吃点好的", d:"换个地方心情会变", k:"woody" },
    { t:"把自己的糗事讲给他听", d:"让他笑一下", k:"musk" } ]},

  { q:"聚会里你更像：", sub:"想象一个你熟悉的局", options:[
    { t:"到处串场聊天的人", d:"跟谁都能聊两句", k:"fruity" },
    { t:"默默帮大家收拾的人", d:"看不得桌子乱", k:"green" },
    { t:"负责点菜和分吃的", d:"怕有人没吃好", k:"sweet" },
    { t:"坐在边上观察的人", d:"其实什么都看到了", k:"mystery" } ]},

  { q:"你更愿意和哪种人做朋友？", sub:"选更吸引你的", options:[
    { t:"想法很多，不停往外冒", d:"跟他待着不无聊", k:"citrus" },
    { t:"话不多，但说一句算一句", d:"靠得住", k:"woody" },
    { t:"很会照顾人，细心", d:"跟他在一起不用操心", k:"green" },
    { t:"有点特别，不太一样", d:"想多了解一点", k:"sweet" } ]},

  { q:"别人夸你，你更想听到：", sub:"哪一句会让你真的开心", options:[
    { t:"你很温柔，跟你相处很舒服", d:"被看见的是性格", k:"floral" },
    { t:"你很有意思，跟你一起很好玩", d:"被认同的是活力", k:"fruity" },
    { t:"你很有自己的想法", d:"被理解的是内在", k:"mystery" },
    { t:"你很靠谱，交给你放心", d:"被信任的是能力", k:"musk" } ]},

  { q:"收到不喜欢的礼物，你会：", sub:"真实反应", options:[
    { t:"当面好好谢谢，收起来", d:"心意最重要", k:"citrus" },
    { t:"用起来，至少让它有用", d:"别浪费", k:"green" },
    { t:"放在看得见的地方", d:"对方来会看到", k:"woody" },
    { t:"过两天悄悄收进柜子", d:"舍不得扔也放不下", k:"sweet" } ]},

  { q:"和陌生人吃饭，你：", sub:"第一顿饭", options:[
    { t:"先找话题，别冷场", d:"聊天才不尴尬", k:"floral" },
    { t:"等对方先开口", d:"不想太主动", k:"green" },
    { t:"观察一圈再说话", d:"先看是什么人", k:"musk" },
    { t:"该说说该吃吃，不勉强", d:"自然就好", k:"mystery" } ]},

  { q:"有人跟你意见不同，你：", sub:"不是辩论，是日常聊天", options:[
    { t:"直接说自己的想法", d:"不藏着", k:"citrus" },
    { t:"听完再说，不急着反驳", d:"先弄清楚", k:"mystery" },
    { t:"笑一笑，换个话题", d:"没必要争", k:"fruity" },
    { t:"回去自己再想想", d:"有些话要消化", k:"musk" } ]},

  { q:"你最怕哪种场合？", sub:"想到就想推掉的那种", options:[
    { t:"很多人，要一直说话", d:"说一天会累", k:"floral" },
    { t:"冷场，没人接话", d:"空气会僵住", k:"woody" },
    { t:"要当众表态", d:"被看着不自在", k:"sweet" },
    { t:"太吵太乱，停不下来", d:"脑子会炸", k:"green" } ]},

  /* ---------- 轮 3 · 情绪 ---------- */
  { q:"压力大的时候，你会：", sub:"最近一次是怎么熬过来的", options:[
    { t:"列个清单，一件件做", d:"做起来就不慌了", k:"citrus" },
    { t:"先把房间收拾干净", d:"环境整齐心才静", k:"musk" },
    { t:"找个没人的地方待着", d:"需要空间", k:"woody" },

const screenEl = document.getElementById("screen");

const KEYS = ["citrus","floral","fruity","woody","green","sweet","mystery","musk"];

function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* 抽题：从题库挑 10 道，重复抽候选，选各族分布最均匀的一组 */
function pickQuestions(n){
  let bestScore = Infinity, pool = [];
  const avg = n * 4 / KEYS.length;
  for(let t=0;t<800;t++){
    const picked = shuffle(QUESTIONS).slice(0, n);
    const cnt = {};
    KEYS.forEach(k => cnt[k] = 0);
    picked.forEach(q => q.options.forEach(o => cnt[o.k]++));
    let s = 0;
    KEYS.forEach(k => { s += (cnt[k] - avg) * (cnt[k] - avg); });
    if(s < bestScore){ bestScore = s; pool = [picked]; }
    else if(s === bestScore){ pool.push(picked); }
  }
  const best = pool[Math.floor(Math.random() * pool.length)];
  return best.map(q => ({ q:q.q, sub:q.sub, options: shuffle(q.options) }));
}

}

function beginQuiz(){
  idx = 0;
  locked = false;
  history = [];
  round = pickQuestions(10);
  scores = {};
  KEYS.forEach(k => scores[k] = 0);
  renderQuestion();
}

function renderQuestion(){
  const q = round[idx];
  const pct = Math.round((idx / round.length) * 100);
  const hint = HINTS[Math.floor(Math.random()*HINTS.length)];
  const opts = q.options.map(o =>
    `<button class="opt" style="--c:${RESULTS[o.k].c}" onclick="choose('${o.k}', this)">
       <span class="dot"></span>
       <span><b>${o.t}</b><small>${o.d}</small></span>
     </button>`
  ).join("");

  screenEl.innerHTML = `
    <section class="fade">
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="q-head">
        <span class="q-index">${String(idx + 1).padStart(2,"0")} / ${round.length}</span>
        <span class="q-hint">${hint}</span>
      </div>
      <h2 class="q-title">${q.q}</h2>
      <p class="q-sub">${q.sub}</p>
      ${opts}
      ${idx > 0 ? `<button class="back" onclick="goBack()">← 上一题</button>` : ""}
    </section>`;
  window.scrollTo(0, 0);
}

function goBack(){
  if(idx === 0 || locked) return;
  idx -= 1;
  const k = history.pop();
  if(k) scores[k] -= 1;
  renderQuestion();
}

function choose(key, el){
  if(locked) return;
  locked = true;
  if(el) el.classList.add("picked");
  scores[key] += 1;
  history.push(key);
  setTimeout(() => {
    locked = false;
    idx += 1;
    if(idx < round.length) renderQuestion();
    else renderResult();
  }, 220);
}

/* 从香水库里挑 3 支：优先贴合次族，并尽量让价位错开 */
function pickPerfumes(main, second){
  const pool = PERFUMES[main] || [];
  const chosen = [];
  const tiers = new Set();

  // 第一轮：贴着次族的，最多 2 支，且价位不重复
  for(const p of pool){
    if(chosen.length >= 2) break;
    if(p.sec === second && !tiers.has(p.tier)){
      chosen.push(p); tiers.add(p.tier);
    }
  }
  // 第二轮：补不同价位
  for(const p of pool){
    if(chosen.length >= 3) break;
    if(!chosen.includes(p) && !tiers.has(p.tier)){
      chosen.push(p); tiers.add(p.tier);
    }
  }
  // 第三轮：还差就随便补
  for(const p of pool){
    if(chosen.length >= 3) break;
    if(!chosen.includes(p)) chosen.push(p);
  }
  return chosen.slice(0, 3);
}

function renderResult(){
  const ranked = KEYS.slice().sort((a,b) => scores[b] - scores[a]);
  const mainKey = ranked[0], secondKey = ranked[1];
  const r = RESULTS[mainKey];

  const second = scores[secondKey];
  const diff = top - second;

  window.__last = { mainKey, secondKey };

  const root = document.documentElement.style;
  root.setProperty("--page-bg", r.bg);
  root.setProperty("--c", r.c);
  root.setProperty("--tint", r.tint);

  root.setProperty("--r", r.r);
  root.setProperty("--ls", r.ls);

  /* 依据一：选了多少题 */

  else if(top >= 4) strength = `十道题里，有 ${top} 道指向这一类，倾向比较明显。`;
  else strength = `你的答案比较分散，这一类只是略微领先，说明你在几种气质之间摇摆。`;

  /* 依据二：和次族的差距 */

  else if(diff >= 2) combo = `你是典型的${r.name}，但身上还留着一点${SHORT[secondKey]}的影子：${SHADE[secondKey]}。`;
  else combo = `你在${r.name}和${SHORT[secondKey]}之间几乎不分上下，两种气质在你身上轮流出现，这并不矛盾。`;

  /* 香调组成：取前 3 族 */
  const maxScore = Math.max(top, 1);
  const compBars = ranked.filter(k => scores[k] > 0).slice(0, 3).map(k => `
    <div class="bar-row">

    </div>`).join("");

  screenEl.innerHTML = `
    <section class="result" style="--c:${r.c};--tint:${r.tint}">
      <button class="music-toggle${musicOn ? "" : " off"}" id="musicToggle" onclick="toggleMusic()">♪ 音乐 ${musicOn ? "开" : "关"}</button>

/* =========================================================
   分享图：用 canvas 画一张 900×1250 的卡片
   ========================================================= */
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawRadar(ctx,cx,cy,R,color){
  const angles = KEYS.map((_,i) => -Math.PI/2 + i*2*Math.PI/KEYS.length);
  const max = Math.max(1, ...KEYS.map(k => scores[k] || 0));

  // 三层网格
  for(let ring=1; ring<=3; ring++){
    ctx.beginPath();
    angles.forEach((a,i)=>{
      const x=cx+Math.cos(a)*R*ring/3, y=cy+Math.sin(a)*R*ring/3;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.closePath();
    ctx.strokeStyle='rgba(90,75,60,.14)';
    ctx.lineWidth=1.2;
    ctx.stroke();
  }
  // 轴线
  angles.forEach(a=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.strokeStyle='rgba(90,75,60,.10)';
    ctx.stroke();
  });
  // 数据多边形
  ctx.beginPath();
  angles.forEach((a,i)=>{
    const v=(scores[KEYS[i]]||0)/max;
    const rr=R*Math.max(.12,v);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle=hexA(color,.26);
  ctx.fill();
  ctx.strokeStyle=color;
  ctx.lineWidth=3;
  ctx.stroke();
  // 顶点
  angles.forEach((a,i)=>{
    const v=(scores[KEYS[i]]||0)/max;
    const rr=R*Math.max(.12,v);
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, 5.5, 0, Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
  });
  // 外圈标签
  ctx.font='500 21px -apple-system,"PingFang SC",sans-serif';
  ctx.fillStyle='rgba(70,58,46,.78)';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  angles.forEach((a,i)=>{
    ctx.fillText(SHORT[KEYS[i]], cx+Math.cos(a)*(R+44), cy+Math.sin(a)*(R+44));
  });
  ctx.textBaseline='alphabetic';
}

function generateShare(){
  const d = window.__last || {};
  const r = RESULTS[d.mainKey] || RESULTS.woody;
  const W=900, H=1250, scale=2;

  const cv = document.createElement('canvas');
  cv.width = W*scale; cv.height = H*scale;
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);

  const qr = new Image();
  qr.onload = () => {

  // 背景
  ctx.fillStyle = r.tint;
  ctx.fillRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H*0.6);
  g.addColorStop(0,'rgba(255,255,255,.5)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H*0.6);

  ctx.textAlign='center';

  ctx.fillStyle='rgba(70,58,46,.55)';
  ctx.font='500 18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('闻 香 识 你 · 香 调 人 格 测 试', W/2, 92);

  ctx.fillStyle='rgba(80,66,52,.62)';
  ctx.font='400 25px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('我的人格是', W/2, 176);

  ctx.fillStyle=r.ink2;
  ctx.font='600 78px "Songti SC","STSong",serif';
  ctx.fillText(r.name, W/2, 276);

  ctx.fillStyle=r.c;
  ctx.font='400 27px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(r.tag, W/2, 330);

  ctx.fillStyle=r.ink2;
  ctx.font='400 33px "Songti SC","STSong",serif';
  ctx.fillText(r.line[0], W/2, 412);
  ctx.fillText(r.line[1], W/2, 462);

  drawRadar(ctx, W/2, 742, 188, r.c);

  // 关键词
  ctx.font='500 23px -apple-system,"PingFang SC",sans-serif';
  const pad=24, gap=14, hgt=48;
  const widths = r.words.map(w => ctx.measureText(w).width + pad*2);
  const total = widths.reduce((a,b)=>a+b,0) + gap*(r.words.length-1);
  let x = (W-total)/2;
  ctx.textBaseline='middle';
  r.words.forEach((w,i)=>{
    roundRect(ctx, x, 1016, widths[i], hgt, hgt/2);
    ctx.fillStyle='rgba(255,255,255,.62)';
    ctx.fill();
    ctx.fillStyle=r.c;
    ctx.fillText(w, x+widths[i]/2, 1016+hgt/2+1);
    x += widths[i]+gap;
  });
  ctx.textBaseline='alphabetic';

  ctx.fillStyle='rgba(70,58,46,.55)';
  ctx.font='400 21px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('测测你是哪一种香', W/2, 1150);
  ctx.fillStyle='rgba(70,58,46,.38)';
  ctx.font='400 18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('ssy007shb-maker.github.io/xiangshinizhi', W/2, 1192);

  // 右上角二维码（圆角裁剪）
  ctx.save();
  roundRect(ctx, W-40-150, 34, 150, 150, 12);
  ctx.clip();
  ctx.drawImage(qr, W-40-150, 34, 150, 150);
  ctx.restore();
  ctx.fillStyle='rgba(70,58,46,.5)';
  ctx.font='400 15px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('扫码测一测', W-40-75, 206);

  const url = cv.toDataURL('image/png');
  const ov = document.createElement('div');
  ov.className='share-overlay';
  ov.innerHTML = `<img src="${url}" alt="香调人格分享图"><p>长按图片保存到相册</p><button class="close">关闭</button>`;
  ov.addEventListener('click', e => { if(e.target.tagName !== 'IMG') ov.remove(); });
  document.body.appendChild(ov);
  };

  qr.src = QR_SRC;
}
